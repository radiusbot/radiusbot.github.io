<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radiusbot</title>
  <meta name="description" content="Radiusbot makes calm, simple apps for iOS and Android.">
  <style>
    :root {
      --bg: #F5EFE4;
      --surface: #FFFFFF;
      --text: #2A2420;
      --text-secondary: #6B5F55;
      --border: #CDBC9E;
      --accent: #23493A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1916;
        --surface: #26221E;
        --text: #F2EBDF;
        --text-secondary: #B3A797;
        --border: #443B32;
        --accent: #4E8C70;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px 80px; }
    h1 { font-size: 1.75rem; margin: 0 0 4px; }
    .intro { color: var(--text-secondary); margin: 0 0 24px; }
    h2 { font-size: 1.125rem; margin: 0 0 8px; }
    p { color: var(--text-secondary); margin: 0 0 10px; overflow-wrap: anywhere; }
    p:last-child { margin-bottom: 0; }
    a { color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Radiusbot</h1>
    <p class="intro">Calm, simple apps for iOS and Android.</p>
    <section class="card">
      <h2>Block Puzzle</h2>
      <p>A relaxing puzzle game on an 8×8 grid. No timer, 100 Journey levels and an endless Classic mode.</p>
      <p><a href="/blockpuzzle/">Privacy policy</a></p>
    </section>
    <section class="card">
      <h2>Contact</h2>
      <p><a href="mailto:radiusbot@gmail.com">radiusbot@gmail.com</a></p>
    </section>
  </main>
</body>
</html>
